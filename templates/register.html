
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart EV | Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background:
                radial-gradient(circle at 15% 20%,
                    rgba(0, 229, 255, 0.18), transparent 35%),
                radial-gradient(circle at 85% 80%,
                    rgba(150, 50, 255, 0.22), transparent 35%),
                linear-gradient(135deg, #07152f, #101d43);
            color: white;
        }

        .container {
            width: 900px;
            max-width: 100%;
            min-height: 570px;
            display: flex;
            overflow: hidden;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(18px);
        }

        .left {
            width: 50%;
            padding: 55px 40px;
            background: linear-gradient(
                145deg,
                rgba(0, 229, 255, 0.13),
                rgba(120, 70, 255, 0.15)
            );
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #00e5ff;
        }

        .left p {
            color: #d8e6ff;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .features {
            line-height: 2.8;
            color: #e5f5ff;
        }

        .right {
            width: 50%;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            font-size: 30px;
            margin-bottom: 12px;
            color: white;
        }

        .subtitle {
            color: #b9c8e8;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 17px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            outline: none;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #b9c8e8;
        }

        input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0,229,255,0.25);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00e5ff, #7c4dff);
            color: #07152f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,229,255,0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #c7d6f5;
        }

        .login-link a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
                padding: 35px 25px;
            }

            .left {
                min-height: 250px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="left">
            <h1>⚡ Smart EV</h1>

            <p>
                Join the Smart City EV Charging Network.
                Create your account and start your EV charging journey.
            </p>

            <div class="features">
                <div>⚡ Fast EV Charging</div>
                <div>📍 Find Nearby Stations</div>
                <div>🔐 Secure User Account</div>
                <div>🔋 Easy Charging Booking</div>
            </div>
        </div>

        <div class="right">
            <h2>Create Account</h2>
            <p class="subtitle">Register to get started</p>

            <form action="/register" method="POST">
                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="tel"
                    name="phone"
                    placeholder="Mobile Number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Create Password"
                    required
                >

                <button type="submit">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="/login">Login Here</a>
            </div>
        </div>

    </div>
</body>
</html>
